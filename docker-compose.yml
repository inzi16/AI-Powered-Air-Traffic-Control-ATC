services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      ATC_ENV: development
      ATC_ALLOWED_HOSTS: localhost,127.0.0.1
      ATC_ALLOWED_ORIGINS: http://localhost:8080
      ATC_ENABLE_SIMCONNECT: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
