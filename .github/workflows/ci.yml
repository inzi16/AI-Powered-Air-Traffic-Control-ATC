name: Smart ATC CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-atc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-core.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Verify committed API contracts
        env:
          PYTHONPATH: backend
        run: python scripts/generate_contracts.py --check
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests
      - name: Run deterministic benchmark gate
        env:
          PYTHONPATH: backend
        run: python scripts/benchmark_backend.py --quick --check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.release.yml config --quiet
        env:
          ATC_API_KEY: ci-only-not-a-production-secret-do-not-use-live
          ATC_ALLOWED_HOSTS: localhost,127.0.0.1
      - name: Build release containers
        run: docker compose -f docker-compose.yml -f docker-compose.release.yml build
        env:
          ATC_API_KEY: ci-only-not-a-production-secret-do-not-use-live
          ATC_ALLOWED_HOSTS: localhost,127.0.0.1
